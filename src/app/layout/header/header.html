<header class="header">
  <button type="button" class="btn-menu" aria-label="Mostrar u ocultar menú" (click)="toggleMenu.emit()">☰</button>
  <a routerLink="/inicio" class="marca">PharmaSoft</a>
  <nav class="menubar">
    <a routerLink="/inicio">Inicio</a>
    <a href="http://localhost:8080/swagger-ui.html" target="_blank" rel="noopener">API</a>
  </nav>
  <div class="usuario-area">
    <span class="usuario" id="usuario-actual">{{ usuario() }}</span>
    @if (estaAutenticado()) {
      <button type="button" class="btn-logout" (click)="cerrarSesion()">Salir</button>
    } @else {
      <a routerLink="/login" class="btn-login-link">Acceder</a>
    }
  </div>
</header>
